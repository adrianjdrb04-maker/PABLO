<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>PABLO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
<style>
:root{--felt:#0b7a2f;--felt2:#064a1c;--paper:#fbf4e1;--gold:#f2c14e;--ink:#fdf8e8;--red:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--felt:#085c24;--felt2:#032e0e}}
:root[data-theme="dark"]{--felt:#085c24;--felt2:#032e0e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--felt2);color:var(--ink);font:15px/1.35 Georgia,'Times New Roman',serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column;padding:8px 8px 10px;background:radial-gradient(ellipse at 50% 40%,var(--felt),var(--felt2) 85%);max-width:640px;margin:0 auto}
#score{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0006;border-radius:10px;padding:6px 12px}
#score .t{display:flex;align-items:baseline;gap:6px}
#score b{font:28px 'Alfa Slab One',Georgia,serif;color:var(--gold);line-height:1}
#score small{opacity:.8}#score i{font-style:normal}#score .mid{font-size:12px;opacity:.75;text-align:center}
#opps{display:flex;gap:5px;margin-top:8px;justify-content:center}
.o{flex:1;max-width:110px;text-align:center;border-radius:9px;padding:5px 3px;font-size:12px;background:#0005;border:2px solid transparent;transition:.2s;overflow:hidden}
.o b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.o small{display:block;color:var(--gold)}
.o.ally b{color:var(--gold)}.o.foe b{color:#ff9d8f}
.o.act{border-color:var(--gold);box-shadow:0 0 12px #f2c14e88}
#felt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;min-height:0}
#center{display:flex;align-items:center;gap:16px}
.tp{text-align:center}.tp small{display:block;font-size:11px;margin-top:3px}
.inf{display:flex;flex-direction:column;gap:2px;font-size:14px}
.inf b{font:18px 'Alfa Slab One',Georgia,serif;color:var(--gold)}.inf em{color:#ff9d8f;font-style:normal}
#table{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:90px}
.pl{text-align:center;font-size:11px;max-width:58px}.pl small{display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status{text-align:center;min-height:20px;font-size:14px;margin:4px 0 6px}
#hand{display:flex;justify-content:center;padding-top:20px;min-height:108px}
.card{--c:#222;width:58px;height:88px;background:var(--paper);color:var(--c);border:1.5px solid #0003;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px;box-sizing:border-box;box-shadow:0 2px 6px #0006;flex:none;transition:transform .15s;user-select:none}
#hand .card{cursor:pointer}#hand .card+.card{margin-left:-10px}
.card.up{transform:translateY(-18px);outline:3px solid var(--gold)}
.card b{font:700 18px 'Alfa Slab One',Georgia,serif;line-height:1}
.card .nm{font-size:8px;letter-spacing:.04em;min-height:9px}
.card svg{width:30px;height:30px;fill:currentColor}
.card.oros{--c:#b87d00}.card.copas{--c:#c0392b}.card.espadas{--c:#1f4e9c}.card.bastos{--c:#2e7d32}
.card.sm{width:46px;height:68px;padding:3px 1px}.card.sm b{font-size:14px}.card.sm svg{width:22px;height:22px}.card.sm .nm{font-size:7px}
@keyframes deal{from{transform:translate(0,-190px) scale(.4) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
#send{display:block;margin:4px auto 0;background:var(--red);color:#fff;border:0;border-radius:22px;padding:9px 28px;font:16px 'Alfa Slab One',Georgia,serif;box-shadow:0 3px 0 #7b1f15}
#send:disabled{opacity:.35;box-shadow:none}
#modal{position:fixed;left:12px;right:12px;top:30%;max-width:420px;margin:0 auto;background:var(--paper);color:#222;border-radius:14px;padding:16px;box-shadow:0 10px 40px #000a;z-index:5;text-align:center}
#modal p{margin:0 0 12px}.bt{display:flex;gap:8px;flex-direction:column}
.bt button,.scr button,.seg button{border:2px solid #0b7a2f;background:#fff;color:#064a1c;border-radius:10px;padding:10px;font-weight:700}
.bt button:first-child{background:#0b7a2f;color:#fff}
.scr{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,var(--felt),var(--felt2) 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;z-index:9;text-align:center;overflow:auto}
.scr h1{font:64px 'Alfa Slab One',Georgia,serif;color:var(--gold);margin:0;text-shadow:0 4px 0 #0007}
.scr h2{font:30px 'Alfa Slab One',Georgia,serif;color:var(--gold);margin:0}
.scr p{margin:0;opacity:.9;max-width:320px}.scr input{padding:10px;border-radius:10px;border:2px solid #0006;width:190px;text-align:center}
.seg{display:flex;gap:8px}.seg button.on{background:var(--gold);border-color:var(--gold);color:#3a2a00}
#go,#mk{background:var(--red);border-color:var(--red);color:#fff;font:20px 'Alfa Slab One',Georgia,serif;padding:12px 40px}
.scr button:disabled{opacity:.4}#solo{background:transparent;color:var(--ink);border-color:#fff6}
#seats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:360px}
.seat{text-align:left;background:#fff;color:#222!important}.seat small{display:block;opacity:.7}
.seat.a{border-color:var(--gold)!important}.seat.b{border-color:#ff9d8f!important}.seat.me{background:var(--gold)!important}
#code{letter-spacing:.12em}
</style></head><body>
<div id="menu" class="scr"><h1>PABLO</h1><p>Juego de cartas por equipos. Los asientos que queden libres los juegan bots.</p>
<input id="nm" maxlength="12" placeholder="Tu nombre"><button id="mk">Crear sala</button>
<div class="seg"><input id="cd" maxlength="12" placeholder="Código de sala"><button id="jn">Unirme</button></div>
<button id="solo">Jugar solo contra bots</button><p id="err"></p></div>
<div id="lobby" class="scr" hidden><h2>Sala <span id="code"></span></h2><p id="lk"></p>
<div id="seats"></div>
<div id="cfg"><div class="seg"><button data-k="n" data-v="4">2 vs 2</button><button data-k="n" data-v="6">3 vs 3</button></div>
<div class="seg" style="margin-top:8px"><button data-k="horns" data-v="1">1 cuerno</button><button data-k="horns" data-v="2">2 cuernos</button></div></div>
<button id="go">Repartir</button><p id="wait"></p></div>
<div id="app" hidden><div id="score"></div><div id="opps"></div>
<div id="felt"><div id="center"></div><div id="table"></div></div>
<div id="status"></div><div id="hand"></div><button id="send">¡ENVIAR!</button></div>
<div id="modal" hidden></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id);
const SU=['oros','copas','espadas','bastos'],ORD=[12,11,10,1,7,6,5,4,3,2],NM={10:'Sota',11:'Caballo',12:'Rey',1:'As'};
const SUN={oros:'Oros',copas:'Copas',espadas:'Espadas',bastos:'Bastos'};
const IC={oros:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#fbf4e1" stroke-width="1.8"/>',
copas:'<path d="M4 3h16c0 8-3.5 12-8 12S4 11 4 3z"/><path d="M11 14h2v5h-2zM7 22h10v-3H7z"/>',
espadas:'<path d="M12 1l3.2 13H8.8z"/><path d="M6 15h12v2H6zM11 17h2v6h-2z"/>',
bastos:'<path d="M9 2h6l1.5 6-1 14h-6l-1-14z"/><circle cx="7.5" cy="9" r="2"/><circle cx="16.5" cy="15" r="2"/>'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const ov=r=>10-ORD.indexOf(r),is4B=c=>c.s=='bastos'&&c.r==4,cs=c=>c.s[0]+c.r,dc=k=>k=='x'?{s:'',r:0}:({s:SU.find(x=>x[0]==k[0]),r:+k.slice(1)});
const TOK=sessionStorage.getItem('pt')||(()=>{const t=Math.random().toString(36).slice(2,10);sessionStorage.setItem('pt',t);return t})();
let HOST=false,G=null,sel=null,LH=-1,lastJ='',NAME='Jugador',ME=0,CODE='';
const tm=i=>i%2,nm=i=>esc(G.sn[i]),isH=i=>!!G.tk[i],seatsOf=t=>[...Array(G.n).keys()].filter(i=>tm(i)==t);
const inFam=c=>c.s==G.trump||is4B(c)||(c.s=='oros'&&c.r==11);
function str(c,lead){
 if(is4B(c))return 1000;
 if(c.s==G.trump&&c.r==3)return 900;
 if(c.s=='oros'&&c.r==11)return 800;
 if(c.s==G.trump&&c.r==2)return 700;
 if(c.s==G.trump)return 500+ov(c.r);
 if(lead&&c.s==lead)return 100+ov(c.r);
 return 0}
function allowed(h,t){if(!inFam(t[0].c))return h;return h.some(c=>inFam(c)&&!is4B(c))?h.filter(inFam):h}
const strong=i=>G.hands[i].filter(c=>str(c,null)>=500).length;
const avgS=t=>{const s=seatsOf(t);return s.reduce((a,i)=>a+strong(i),0)/s.length};
function cardEl(c,cls='',st=''){return `<div class="card ${c.s} ${cls}" data-id="${cs(c)}" style="${st}"><b>${c.r}</b><span class="nm">${NM[c.r]||''}</span><svg viewBox="0 0 24 24">${IC[c.s]}</svg></div>`}
function view(v){['menu','lobby','app'].forEach(x=>$(x).hidden=x!=v)}

/* ---------- red (servidor) ---------- */
const S=io();
function apply(o){const j=JSON.stringify(o);if(j==lastJ)return;lastJ=j;const g=Object.assign({},o);
 if(o.ph=='play'){g.tc=dc(o.tc);g.trump=g.tc.s;g.value=o.v;g.table=o.tb.map(x=>({p:x[0],c:dc(x[1])}));g.hands=o.h.map(h=>h.map(dc))}
 G=g;HOST=!!o.host;render()}
function act(o){S.emit('act',o)}
function joinRoom(code){NAME=($('nm').value.trim()||sessionStorage.getItem('pn')||'Jugador').slice(0,12);CODE=code.toLowerCase().replace(/[^a-z0-9]/g,'');
 if(!CODE){$('err').textContent='Escribe el código de la sala.';return}
 sessionStorage.setItem('pn',NAME);$('err').textContent='Conectando…';S.emit('join',{code:CODE,tok:TOK,name:NAME});try{location.hash=CODE}catch(e){}}
S.on('st',apply);S.on('err',m=>{$('err').textContent=m});
S.on('connect',()=>{if(CODE)S.emit('join',{code:CODE,tok:TOK,name:NAME})});
const newCode=()=>Math.random().toString(36).slice(2,7);

/* ---------- pantallas ---------- */
function dlgView(){const d=G.dlg;if(!d||ME<0)return null;const mt=tm(ME),tn=t=>t==mt?'Tu equipo':'Los rivales';
 if(d.k=='end'){let t;if(d.x=='ver')t=`${tn(d.t)} llevaba 24 y no juega: +1 para ${tn(1-d.t).toLowerCase()}.`;
  else{const y=d.why;t=(y?(y.r=='ren'?`Renuncio de ${nm(y.p)}: no arrastró. `:`${nm(y.p)} envía y el otro equipo no acepta. `):'')+`Gana la mano: <b>${tn(d.w)}</b>.`+(d.horn?' ¡Se lleva un cuerno! 🐂':` +${d.v} puntos.`);
   if(d.done)t=`<b>¡Partida para ${tn(d.w).toLowerCase()}!</b><br>`+t}
  return [t,[d.done?'Volver a la sala':'Siguiente mano']]}
 if(d.t!=mt)return null;
 if(d.k=='send')return [`<b>${nm(d.s)} envía.</b><br>¿Aceptáis jugar la mano por ${d.nv} puntos?`,['Aceptar','No: echamos las cartas']];
 return ['<b>Al VER.</b> Tu equipo lleva 24 puntos. Mira tus cartas: ¿jugáis la mano?',['Jugar la mano','No jugar (+1 para ellos)']]}
function render(){if(!G)return;ME=G.me;
 if(G.ph=='lobby'){view('lobby');$('modal').hidden=true;drawLobby()}else{view('app');drawGame()}}
function drawLobby(){const g=G;$('code').textContent=CODE;$('lk').textContent='Enlace para tus amigos: '+location.origin+location.pathname+'#'+CODE+'. Toca un asiento libre para sentarte.';
 $('seats').innerHTML=Array.from({length:g.n},(_,i)=>`<button class="seat ${i%2?'b':'a'} ${i==ME?'me':''}" data-i="${i}"><small>Equipo ${i%2?'B':'A'}</small>${esc(g.sn[i])}${g.tk[i]?'':' (libre)'}</button>`).join('');
 $('cfg').hidden=!HOST;$('go').hidden=!HOST;$('wait').textContent=HOST?'':'Esperando a que el anfitrión reparta…';
 document.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',g[b.dataset.k]==+b.dataset.v))}
function drawGame(){const g=G,n=g.n,me=Math.max(ME,0),mt=tm(me),dl=g.hid!==LH;LH=g.hid;
 $('score').innerHTML=`<div class="t"><small>Nosotros</small><b>${g.pts[mt]}</b><i>${'🐂'.repeat(g.hw[mt])}</i></div><div class="mid">hasta 24<br>${g.horns} ${g.horns>1?'cuernos':'cuerno'}</div><div class="t"><i>${'🐂'.repeat(g.hw[1-mt])}</i><b>${g.pts[1-mt]}</b><small>Ellos</small></div>`;
 let o='';for(let k=1;k<n;k++){const i=(me+k)%n;o+=`<div class="o ${tm(i)==mt?'ally':'foe'} ${g.turn==i&&g.table.length<n?'act':''}"><b>${nm(i)}</b>${g.hands[i].length} cartas${i==g.dealer?'<small>reparte</small>':''}</div>`}
 $('opps').innerHTML=o;
 $('center').innerHTML=`<div class="tp">${cardEl(g.tc,'sm')}<small>Triunfo: ${SUN[g.trump]}</small></div><div class="inf"><b>Mano a ${g.value}</b><span>Bazas ${g.tr[mt]}–${g.tr[1-mt]}</span>${g.ver!=null?`<em>${g.ver==2?'Muerte súbita':'Al VER'}</em>`:''}</div>`;
 $('table').innerHTML=g.table.map(x=>`<div class="pl">${cardEl(x.c,'sm')}<small>${nm(x.p)}</small></div>`).join('');
 const mh=ME<0?[]:g.hands[me];
 $('hand').innerHTML=mh.map((c,i)=>cardEl(c,sel==cs(c)?'up':'',dl?`animation:deal .4s ease-out ${i*.14}s both`:'')).join('');
 const mine=ME>=0&&g.turn==me&&!g.busy&&!g.dlg;
 $('send').disabled=!(mine&&!g.sent&&g.table.length<n);
 const D=dlgView(),m=$('modal');m.hidden=!D;
 if(D){m.innerHTML=`<p>${D[0]}</p><div class="bt">${D[1].map((t,i)=>`<button data-v="${i?0:1}">${t}</button>`).join('')}</div>`}
 let s=g.msg;if(!s){if(g.dlg&&!D)s='Esperando respuesta…';else if(mine)s=sel?'Toca otra vez para tirarla':'Tu turno: elige una carta';else if(g.busy&&g.turn!=me&&!g.dlg)s=`${g.sn[g.turn]} está pensando…`}
 $('status').textContent=s}

/* ---------- eventos ---------- */
$('hand').onclick=e=>{const el=e.target.closest('.card');if(!el||!G||G.ph!='play'||G.busy||G.dlg||ME<0||G.turn!=ME)return;const id=el.dataset.id;
 if(sel==id){sel=null;act({t:'play',id})}else{sel=id;render()}};
$('send').onclick=()=>{if(G&&!G.busy&&G.turn==ME&&!G.sent)act({t:'send'})};
$('modal').onclick=e=>{const b=e.target.closest('button');if(b)act({t:'ans',v:+b.dataset.v})};
$('seats').onclick=e=>{const b=e.target.closest('.seat');if(b)act({t:'sit',seat:+b.dataset.i})};
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>HOST&&S.emit('cfg',{k:b.dataset.k,v:+b.dataset.v}));
$('go').onclick=()=>{if(HOST)S.emit('start')};
$('mk').onclick=()=>joinRoom(newCode());
$('jn').onclick=()=>joinRoom($('cd').value);
$('solo').onclick=()=>joinRoom(newCode());
$('cd').value=(location.hash||'').slice(1);
$('nm').value=sessionStorage.getItem('pn')||'';
if(location.hash.length>1&&sessionStorage.getItem('pn'))joinRoom(location.hash.slice(1));
</script></body></html>
